name: Bug report
description: Something in Praxis is broken or shows the wrong thing
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /app/portfolio
        2. Add a holding ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Landing page, For You (news), Portfolio, Journal, Saved, Events, Notifications, API routes, Other]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: Chrome 130 on macOS 15
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console output
